
name: E-Digital Pakistan CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE_NAME: muhammadusamasaeed/e-digital-pakistan

jobs:
  ci-cd:
    name: Lint, Build, Test, Scan and Publish
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # 4. Run ESLint separately
      - name: Run ESLint
        run: npm run lint

      # 5. Setup Docker Buildx
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 6. Build Docker image ONCE
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 7. Smoke test the built container
      - name: Smoke test container
        run: |
          docker run -d --name app -p 3000:3000 \
            "${IMAGE_NAME}:${{ github.sha }}"

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then
              echo "Application is responding after ${i}s"
              exit 0
            fi
            sleep 1
          done

          echo "Application failed to become ready"
          docker logs app
          exit 1


      # 9. Login to Docker Hub only on main pushes
      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 10. Push the SAME tested and scanned image
      - name: Push image to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "${IMAGE_NAME}:${{ github.sha }}"
