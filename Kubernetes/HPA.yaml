
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: edp-web-hpa
  namespace: edp
  labels:
    app: edp-web

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: edp-web

  minReplicas: 3
  maxReplicas: 5

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
      selectPolicy: Max

    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
      selectPolicy: Max
