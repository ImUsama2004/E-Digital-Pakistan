
# Local Kind configuration for Traefik
# Helm chart: traefik/traefik
# Chart version: 42.3.1

# Run one Traefik instance to conserve local resources
deployment:
  kind: Deployment
  replicas: 1

# Resource allocation for the local Kind cluster
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Enable standard Kubernetes Ingress support
providers:
  kubernetesIngress:
    enabled: true
    ingressClass: traefik
  kubernetesCRD:
    enabled: false

# Register Traefik as an explicit IngressClass
ingressClass:
  enabled: true
  name: traefik
  isDefaultClass: false

# Use an internal ClusterIP service for local Kind
service:
  enabled: true
  spec:
    type: ClusterIP

# Disable anonymous usage reporting
global:
  sendAnonymousUsage: false
